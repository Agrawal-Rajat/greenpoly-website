<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificates - Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #e8f5e9;
            /* light green background */
            color: #2e7d32;
            /* dark green text */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.2rem;
            max-width: 500px;
            margin: 0 auto 2rem;
        }

        .loader {
            border: 6px solid #c8e6c9;
            border-top: 6px solid #66bb6a;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        .home-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #66bb6a;
            /* green button */
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1rem;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .home-btn:hover {
            background-color: #43a047;
            /* darker green on hover */
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            color: #4caf50;
        }
    </style>
</head>

<body>
    <div class="loader"></div>
    <h1>Coming Soon</h1>
    <p>Our Certificates page is currently in the process of being built.
        Check back later to explore our achievements and recognitions!</p>

    <a href="index.html" class="home-btn">Back to Home</a>

    <footer>© 2025 GreenPoly
        <!-- <p>Made with ❤️ by <a href="https://codeshor.com" target="_blank"
                style="color: blueviolet; text-decoration: none;">CodeShor</a></p> -->
    </footer>

</body>

</html>
